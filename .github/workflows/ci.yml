name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Run tests
        run: cargo test

  release:
    name: release build (${{ matrix.runner }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Build release
        run: |
          IFS=',' read -ra TS <<< "$TARGETS"
          for t in "${TS[@]}"; do
            echo "--- building $t ---"
            cargo build --release --target "$t"
          done
      - name: Stage binaries
        run: |
          IFS=',' read -ra TS <<< "$TARGETS"
          for t in "${TS[@]}"; do
            cp "target/$t/release/solenv" "solenv-$t"
            chmod +x "solenv-$t"
          done
          ls -l solenv-*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solenv-${{ runner.name }}
          path: solenv-*
          if-no-files-found: error
      - name: Attach to GitHub Release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "solenv $GITHUB_REF_NAME" --generate-notes --verify-tag >/dev/null 2>&1 || true
          for i in 1 2 3 4 5; do
            ok=1
            for f in solenv-*; do gh release upload "$GITHUB_REF_NAME" "$f" --clobber || ok=0; done
            [ $ok -eq 1 ] && exit 0
            sleep 3
          done
          exit 1

  checksums:
    name: release checksums
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: solenv-*
      - name: Generate and upload SHA256SUMS
        run: |
          cd dist
          sha256sum solenv-* > SHA256SUMS
          cat SHA256SUMS
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "solenv $GITHUB_REF_NAME" --generate-notes --verify-tag >/dev/null 2>&1 || true
          for i in 1 2 3 4 5; do
            gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber && exit 0
            sleep 3
          done
          exit 1
